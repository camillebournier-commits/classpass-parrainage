<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Redirection...</title>
  <!-- Masque l'adresse d'origine (HTTP Referer) -->
  <meta name="referrer" content="no-referrer">
  <script>
    window.onload = function() {
      // 1. URL cible avec le code de parrainage uniquement
      var targetUrl = "https://classpass.com/refer/LR9JGRRP21";
      
      // 2. Encapsulation dans un proxy d'anonymisation pour masquer l'adresse IP et la provenance
      var anonymousUrl = "https://nullrefer.com/?" + encodeURIComponent(targetUrl);
      
      // 3. Redirection automatique
      window.location.replace(anonymousUrl);
    };
  </script>
</head>
<body>
  <p>Redirection en cours vers une connexion sécurisée...</p>
</body>
</html>
