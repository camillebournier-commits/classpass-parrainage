<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <!-- Indique à tous les navigateurs de masquer totalement l'URL d'origine -->
  <meta name="referrer" content="no-referrer">
  <title>Redirection...</title>
</head>
<body>

  <!-- Lien sécurisé avec l'attribut rel="noreferrer" -->
  <a id="parrainage" href="https://classpass.com/refer/LR9JGRRP21" rel="noreferrer">
    Cliquez ici pour récupérer vos crédits
  </a>

  <script>
    // Redirection automatique tout en appliquant la politique no-referrer
    window.onload = function() {
      var link = document.getElementById('parrainage');
      // Crée une ouverture propre pour ne pas transmettre la page source
      var a = document.createElement('a');
      a.href = link.href;
      a.rel = 'noreferrer';
      document.body.appendChild(a);
      a.click();
    };
  </script>
</body>
</html>
